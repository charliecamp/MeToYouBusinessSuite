<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Order | Me To You Designs</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/create-order.css">

</head>

<body>

<div class="page">

<header class="pageHeader">

<button
class="backButton"
onclick="location.href='dashboard.html'">

←

</button>

<img
src="logo.PNG"
class="pageLogo"
alt="Me To You Designs">

</header>

<section class="hero">

<h1>

Create New Order

</h1>

<div class="heart">

♡

</div>

<p>

Complete the details below to create a new customer order.

</p>

</section>

<!-- CUSTOMER DETAILS -->

<section class="card">

<h2>

👤 Customer Details

</h2>

<label>

Customer Name

</label>

<input
id="customerName"
type="text">

<label>

Phone Number

</label>

<input
id="customerPhone"
type="tel">

<label>

Email Address (Optional)

</label>

<input
id="customerEmail"
type="email">

<label>

Where Ordered From

</label>

<select id="orderSource">

<option>Facebook</option>

<option>Instagram</option>

<option>Snapchat</option>

<option>TikTok</option>

<option>Other</option>

</select>

<label>

Social Username (Optional)

</label>

<input
id="socialUsername"
type="text"
placeholder="@username">

</section>

<script src="js/create-order.js"></script>

</body>

</html>

<!-- ===================================== -->
<!-- ORDER SUMMARY -->
<!-- ===================================== -->

<section class="card">

<h2>

📋 Order Summary

</h2>

<label>

Order Number

</label>

<input
id="orderNumber"
type="text"
readonly>

<label>

Order Date

</label>

<input
id="orderDate"
type="date">

<label>

Date Needed By

</label>

<input
id="dateNeeded"
type="date">

<label>

Order Status

</label>

<select id="orderStatus">

<option>New Order</option>

<option>Designing</option>

<option>Making</option>

<option>Ready</option>

<option>Completed</option>

</select>

</section>

<!-- ===================================== -->
<!-- COLLECTION / DELIVERY -->
<!-- ===================================== -->

<section class="card">

<h2>

🚚 Collection / Delivery

</h2>

<label>

Delivery Method

</label>

<select id="deliveryMethod">

<option>Collection</option>

<option>Local Delivery</option>

<option>Postal Delivery</option>

</select>

<label>

Address Line 1

</label>

<input
id="address1"
type="text">

<label>

Address Line 2 (Optional)

</label>

<input
id="address2"
type="text">

<label>

Town / City

</label>

<input
id="town"
type="text">

<label>

County (Optional)

</label>

<input
id="county"
type="text">

<label>

Postcode

</label>

<input
id="postcode"
type="text">

</section>
