<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Order | Me To You Designs</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/create-order.css">

</head>

<body>

<div class="page">

<header class="pageHeader">

<button
class="backButton"
onclick="location.href='dashboard.html'">

←

</button>

<img
src="logo.PNG"
class="pageLogo"
alt="Me To You Designs">

</header>

<section class="hero">

<h1>

Create New Order

</h1>

<div class="heart">

♡

</div>

<p>

Complete the details below to create a new customer order.

</p>

</section>

<!-- CUSTOMER DETAILS -->

<section class="card">

<h2>

👤 Customer Details

</h2>

<label>

Customer Name

</label>

<input
id="customerName"
type="text">

<label>

Phone Number

</label>

<input
id="customerPhone"
type="tel">

<label>

Email Address (Optional)

</label>

<input
id="customerEmail"
type="email">

<label>

Where Ordered From

</label>

<select id="orderSource">

<option>Facebook</option>

<option>Instagram</option>

<option>Snapchat</option>

<option>TikTok</option>

<option>Other</option>

</select>

<label>

Social Username (Optional)

</label>

<input
id="socialUsername"
type="text"
placeholder="@username">

</section>

<!-- ===================================== -->
<!-- ORDER SUMMARY -->
<!-- ===================================== -->

<section class="card">

<h2>

📋 Order Summary

</h2>

<label>

Order Number

</label>

<input
id="orderNumber"
type="text"
readonly>

<label>

Order Date

</label>

<input
id="orderDate"
type="date">

<label>

Date Needed By

</label>

<input
id="dateNeeded"
type="date">

<label>

Order Status

</label>

<select id="orderStatus">

<option>New Order</option>

<option>Designing</option>

<option>Making</option>

<option>Ready</option>

<option>Completed</option>

</select>

</section>

<!-- ===================================== -->
<!-- COLLECTION / DELIVERY -->
<!-- ===================================== -->

<section class="card">

<h2>

🚚 Collection / Delivery

</h2>

<label>

Delivery Method

</label>

<select id="deliveryMethod">

<option>Collection</option>

<option>Local Delivery</option>

<option>Postal Delivery</option>

</select>

<label>

Address Line 1

</label>

<input
id="address1"
type="text">

<label>

Address Line 2 (Optional)

</label>

<input
id="address2"
type="text">

<label>

Town / City

</label>

<input
id="town"
type="text">

<label>

County (Optional)

</label>

<input
id="county"
type="text">

<label>

Postcode

</label>

<input
id="postcode"
type="text">

</section>

<!-- ===================================== -->
<!-- ITEMS ORDERED -->
<!-- ===================================== -->

<section class="card">

<h2>

📦 Items Ordered

</h2>

<div id="itemsContainer">

<div class="itemCard">

<label>

Product / Item

</label>

<input
type="text"
class="itemName"
placeholder="Example: Balloon Stack">

<label>

Quantity

</label>

<input
type="number"
class="itemQuantity"
value="1"
min="1">

<label>

Unit Price (£)

</label>

<input
type="number"
class="itemPrice"
value="0"
step="0.01">

<label>

Item Total (£)

</label>

<input
type="number"
class="itemTotal"
value="0.00"
readonly>

<label>

Description / Theme

</label>

<textarea
class="itemDescription"
placeholder="Colours, wording, theme, etc."></textarea>

<button
type="button"
class="removeItemButton">

🗑 Remove Item

</button>

</div>

</div>

<button
type="button"
id="addItemButton">

➕ Add Another Item

</button>

</section>

<!-- ===================================== -->
<!-- ORDER NOTES -->
<!-- ===================================== -->

<section class="card">

<h2>

📝 Order Notes

</h2>

<label>

Upload Customer Images

</label>

<input
type="file"
id="customerImages"
multiple>

<label>

Upload Mock-ups

</label>

<input
type="file"
id="mockupImages"
multiple>

<label>

Notes

</label>

<textarea
id="orderNotes"
placeholder="Anything the customer has requested..."></textarea>

</section>

<!-- ===================================== -->
<!-- PAYMENT -->
<!-- ===================================== -->

<section class="card">

<h2>

💷 Payment

</h2>

<label>

Order Total (£)

</label>

<input
id="orderTotal"
type="number"
value="0.00"
readonly>

<label>

Payment Status

</label>

<input
id="paymentStatus"
type="text"
value="Not Paid"
readonly>

<label>

Total Paid (£)

</label>

<input
id="totalPaid"
type="number"
value="0.00"
readonly>

<label>

Remaining Balance (£)

</label>

<input
id="remainingBalance"
type="number"
value="0.00"
readonly>

<h3>

📜 Payment History

</h3>

<div id="paymentHistory">

<p>No payments recorded yet.</p>

</div>

<button
type="button"
id="addPaymentButton">

➕ Add Payment

</button>

</section>

<!-- ===================================== -->
<!-- SAVE ORDER -->
<!-- ===================================== -->

<section class="card">

<button
type="button"
id="saveOrderButton">

💗 Save Order

</button>

</section>

</div>

<script src="js/create-order.js"></script>

</body>

</html>
