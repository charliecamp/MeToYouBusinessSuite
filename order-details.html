<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order Details | Me To You Designs</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="css/order-details.css">

</head>

<body>

<div class="page">

<header class="pageHeader">

<button
class="backButton"
onclick="location.href='orders.html'">

←

</button>

<img
src="logo.PNG"
class="logo"
alt="Logo">

<h1>Order Details</h1>

<p>

Everything for this customer in one place.

</p>

</header>

<!-- ORDER SUMMARY -->

<section class="card summaryCard">

<h2 id="orderHeading">

Loading Order...

</h2>

<p id="orderCustomer">

Loading customer...

</p>

<div class="statusBadge"
id="summaryStatus">

New Order

</div>

<div class="summaryGrid">

<div class="summaryItem">

<h4>Due Date</h4>

<p id="summaryDue">-</p>

</div>

<div class="summaryItem">

<h4>Total</h4>

<p id="summaryTotal">£0.00</p>

</div>

<div class="summaryItem">

<h4>Paid</h4>

<p id="summaryPaid">£0.00</p>

</div>

<div class="summaryItem">

<h4>Remaining</h4>

<p id="summaryRemaining">£0.00</p>

</div>

</div>

</section>

<!-- CUSTOMER DETAILS -->

<section class="card">

<div class="sectionHeader">

<h2>

👤 Customer Details

</h2>

<button
type="button"
class="editSectionButton">

✏️

</button>

</div>

<div class="formGroup">

<label>

Customer Name

</label>

<input
type="text"
id="customerName">

</div>

<div class="formGroup">

<label>

Contact Number

</label>

<input
type="text"
id="customerContact">

</div>

<div class="formGroup">

<label>

Order Source

</label>

<select id="orderSource">

<option>Facebook</option>

<option>Instagram</option>

<option>TikTok</option>

<option>Website</option>

<option>Returning Customer</option>

<option>Recommendation</option>

<option>Other</option>

</select>

</div>

<div class="formGroup">

<label>

Social Username

</label>

<input
type="text"
id="socialUsername">

</div>

</section>

<!-- ORDER ITEMS -->

<section class="card">

<div class="sectionHeader">

<h2>

📦 Order Items

</h2>

<button
type="button"
id="addItemButton">

＋ Add Item

</button>

</div>

<div id="itemsContainer">

</div>

</section>

<!-- PAYMENT -->

<section class="card">

<div class="sectionHeader">

<h2>

💷 Payment

</h2>

<button
type="button"
id="addPaymentButton">

＋

<!-- COLLECTION / DELIVERY -->

<section class="card">

<div class="sectionHeader">

<h2>

🚚 Collection / Delivery

</h2>

</div>

<div class="formGroup">

<label>

Delivery Method

</label>

<select id="deliveryMethod">

<option>Collection</option>

<option>Delivery</option>

</select>

</div>

<div class="formGroup">

<label>

Date Needed

</label>

<input
type="date"
id="dateNeeded">

</div>

<div class="formGroup">

<label>

Address Line 1

</label>

<input
type="text"
id="address1">

</div>

<div class="formGroup">

<label>

Address Line 2

</label>

<input
type="text"
id="address2">

</div>

<div class="formGroup">

<label>

Town / City

</label>

<input
type="text"
id="town">

</div>

<div class="formGroup">

<label>

County

</label>

<input
type="text"
id="county">

</div>

<div class="formGroup">

<label>

Postcode

</label>

<input
type="text"
id="postcode">

</div>

</section>

<!-- ORDER NOTES -->

<section class="card">

<div class="sectionHeader">

<h2>

📝 Order Notes

</h2>

</div>

<textarea
id="orderNotes"
rows="6"
placeholder="Add any notes about this order..."></textarea>

</section>

<!-- ORDER PROGRESS -->

<section class="card">

<div class="sectionHeader">

<h2>

✨ Order Progress

</h2>

</div>

<div class="formGroup">

<label>

Current Status

</label>

<select id="orderStatus">

<option>New Order</option>

<option>Awaiting Approval</option>

<option>Making</option>

<option>Ready for Collection</option>

<option>Completed</option>

<option>Cancelled</option>

</select>

</div>

<div class="progressBar">

<div id="progressFill"></div>

</div>

</section>

<!-- ACTIONS -->

<section class="card actionCard">

<button
id="saveChanges"
class="primaryButton">

💗 Save Changes

</button>

<div class="buttonRow">

<button
id="duplicateOrder"
class="secondaryButton">

📄 Duplicate

</button>

<button
id="deleteOrder"
class="dangerButton">

🗑 Delete

</button>

</div>

</section>

</div>

<script
type="module"
src="js/order-details.js">

</script>

</body>

</html>
